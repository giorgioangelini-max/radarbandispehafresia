# =====================================================================
# FONTI DEL RADAR BANDI — Speha Fresia
# =====================================================================
# Ogni voce è una fonte controllata ogni mattina.
#
#   id          codice breve, unico, senza spazi
#   nome        come compare nel sito
#   ente        chi pubblica (compare nella scheda)
#   blocco      regionale | nazionale | fondi | ue | aggregatori
#   territorio  sicilia | lazio | nazionale | ue | auto  (auto = lo capisce dal testo)
#   tipo        rss   → feed RSS/Atom (il più affidabile)
#               html  → pagina web: prende i link che sembrano bandi/avvisi
#               ft    → Funding & Tenders Portal UE (API ufficiale)
#   url         indirizzo da leggere
#   fallback    (facoltativo) seconda strada se la prima fallisce: {tipo, url}
#   selettore   (facoltativo, solo html) selettore CSS dei blocchi che contengono
#               i singoli bandi, per pagine dove il generico prende troppo o poco
#   verificato  false finché non lo controlli col workflow "Verifica fonti";
#               è solo un promemoria per te, non cambia il comportamento
#
# Per aggiungere una fonte: copia una voce, cambia id/nome/url, salva.
# Per toglierla: cancella la voce oppure metti  attiva: false
# =====================================================================

