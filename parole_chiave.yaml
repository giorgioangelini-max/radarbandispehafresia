# =====================================================================
# PERTINENZA PER SPEHA FRESIA
# =====================================================================
# Ogni bando prende un punteggio sommando i pesi delle parole trovate
# in titolo e sommario (nel titolo valgono doppio). Il punteggio decide
# l'etichetta: alta / media / bassa. Le soglie sono in fondo.
#
# Le parole sono cercate come "inizio di parola", quindi "formativ"
# prende formativo, formativa, formativi. Maiuscole/accenti non contano.
# =====================================================================

