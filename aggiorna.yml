# Gira ogni mattina alle 6:30 (ora italiana estiva; 5:30 in inverno)
# e ogni volta che premi "Run workflow" nella scheda Actions.
name: Aggiorna bandi

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aggiorna-bandi
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Leggi tutte le fonti
        run: python raccogli.py

      - name: Salva il database aggiornato
        run: |
          git config user.name "radar-bandi"
          git config user.email "radar-bandi@users.noreply.github.com"
          git add data/bandi.json
          if git diff --cached --quiet; then
            echo "Nessuna novità oggi."
          else
            git commit -m "Aggiornamento bandi $(date -u +%Y-%m-%d)"
            git push
          fi
